spring:

  http:
    converters:
      preferred-json-mapper: jackson2

  task:
    execution:
      pool:
        core-size: 8
      shutdown:
        await-termination: true
        await-termination-period: 5s

  jackson:
    default-property-inclusion: non_null

  kafka:
    producer:
      properties:
        max.in.flight.requests.per.connection: 1

api:
  # The base URL of the documentation of the error types. The "type" member of a
  # problem detail is this URL followed by the anchor of the error, e.g.
  # ".../docs/api/errors.md#order-state-conflict"
  problem-type-docs-url: https://github.com/tonminhce/postgresql-event-sourcing/blob/main/docs/api/errors.md

event-sourcing:
  snapshotting:
    # com.example.eventsourcing.domain.AggregateType
    ORDER:
      enabled: true
      # Create a snapshot on every nth event
      nth-event: 10
  # Available subscription: polling, postgres-channel
  subscriptions: postgres-channel
  # Batch size for subscription processor pagination
  subscription-batch-size: 500
  # Max retries before routing poison-pill event to Dead Letter Queue
  subscription-max-retries: 3
  # Initial exponential backoff delay in milliseconds
  subscription-retry-backoff-ms: 100
  polling-subscriptions:
    polling-initial-delay: PT1S
    polling-interval: PT1S

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: postgres-event-sourcing
