spring:

  http:
    converters:
      preferred-json-mapper: jackson2

  task:
    execution:
      pool:
        core-size: 8
      shutdown:
        await-termination: true
        await-termination-period: 5s

  jackson:
    default-property-inclusion: non_null

  kafka:
    producer:
      properties:
        max.in.flight.requests.per.connection: 1

event-sourcing:
  snapshotting:
    # com.example.eventsourcing.domain.AggregateType
    ORDER:
      enabled: true
      # Create a snapshot on every nth event
      nth-event: 10
  # Available subscription: polling, postgres-channel
  subscriptions: postgres-channel
  # Batch size for subscription processor pagination
  subscription-batch-size: 500
  # Max retries before routing poison-pill event to Dead Letter Queue
  subscription-max-retries: 3
  # Initial exponential backoff delay in milliseconds
  subscription-retry-backoff-ms: 100
  polling-subscriptions:
    polling-initial-delay: PT1S
    polling-interval: PT1S
