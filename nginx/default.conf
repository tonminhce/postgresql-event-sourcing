# Docker's embedded DNS server. It only exists inside a Docker network, so this
# file is specific to the Docker Compose setup of this sample.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 5s;

upstream event_sourcing_app {
    # `resolve` makes Nginx re-resolve the name and pick up the new address when
    # the container is recreated, without a restart of Nginx.
    server event-sourcing-app:8080 resolve max_fails=3 fail_timeout=10s;
    zone event_sourcing_app 64k;
    keepalive 32;
}

server {
    listen 80;
    server_tokens off;

    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required to reuse the upstream connections of the keepalive pool
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Fail over to the other instance of the application
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;

        # Let Nginx start if upstream host is unreachable
        proxy_pass http://event_sourcing_app;
    }
}
