resolver 127.0.0.11 valid=5s ipv6=off;

upstream event_sourcing_app {
    # `resolve` makes Nginx re-resolve the name and pick up the new address when
    # the container is recreated, without a restart of Nginx.
    server event-sourcing-app:8080 resolve;
    zone event_sourcing_app 64k;
}

server {
    listen 80;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Let Nginx start if upstream host is unreachable
        proxy_pass http://event_sourcing_app;
    }
}
